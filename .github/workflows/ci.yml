name: CI

on:
  workflow_dispatch:
  push:
    paths:
      - "lua/**"
      - "tests/**"
      - "doc/**"
      - ".github/workflows/**"
      - ".luacheckrc"
      - "stylua.toml"
  pull_request:
    paths:
      - "lua/**"
      - "tests/**"
      - "doc/**"
      - ".github/workflows/**"
      - ".luacheckrc"
      - "stylua.toml"

permissions:
  contents: read

jobs:
  checks:
    name: Neovim ${{ matrix.nvim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.9.5, v0.10.4, stable, nightly]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Setup Stylua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.4.1
          args: false

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Format check
        run: stylua --check .

      - name: Lint
        run: luacheck lua tests

      - name: Headless smoke test
        run: nvim --headless -u NONE -l tests/smoke.lua

      - name: Help tags
        run: nvim --headless -u NONE -l tests/helptags.lua
